<h2>{{ 'Profile.Title' | translate }}</h2>
<p>{{ 'Profile.Hint' | translate }}</p>
<label>
  {{ 'Profile.Name' | translate }}
  <input [value]="name()" (input)="setName($event)" maxlength="80" />
</label>
@if (error()) {
  <p class="error">{{ error() }}</p>
}
<div class="actions">
  <button type="button" class="cancel" (click)="cancel()">{{ 'Profile.Cancel' | translate }}</button>
  <button type="button" class="confirm" (click)="save()" [disabled]="saving() || name().trim().length < 2">
    {{ saving() ? ('Profile.Saving' | translate) : ('Profile.Save' | translate) }}
  </button>
</div>
