<h2 id="logout-title">{{ 'Logout.Title' | translate }}</h2>
<p>{{ 'Logout.Body' | translate }}</p>
<div class="actions">
  <button type="button" class="cancel" (click)="stay()">{{ 'Logout.Cancel' | translate }}</button>
  <button type="button" class="confirm" (click)="leave()">{{ 'Logout.Confirm' | translate }}</button>
</div>
